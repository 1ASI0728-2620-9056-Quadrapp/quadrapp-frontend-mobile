name: quadrapp_mobile
description: "Quadrapp: app móvil del conductor (Integra Labs)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  get_it: ^9.3.0
  go_router: ^17.5.0
  intl: any
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  stream_channel: ^2.1.4
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Licencias OFL de las fuentes (se muestran en la pantalla de licencias).
    - fonts/licenses/
    # Datos de prueba de los mocks (USE_MOCKS=true).
    - assets/mocks/seed.json

  # Fuentes incluidas como assets: la app se ve igual sin conexión.
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
